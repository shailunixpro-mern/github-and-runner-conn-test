name: ServiceNow Connectivity Test

on:
  workflow_dispatch:

jobs:
  create-incident:
    runs-on: BamAgentSrvLinux

    steps:
      - name: Test ServiceNow connectivity and create incident
        run: |
          # Debug: Check if we can resolve the hostname
          nslookup ${{ secrets.SERVICENOW_INSTANCE }}
          
          # Debug: Test basic connectivity
          #ping -c 1 ${{ secrets.SERVICENOW_INSTANCE }}
          
          set +e
          RESPONSE=$(curl -k -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "X-UserToken: ${{ secrets.SERVICENOW_USER_TOKEN }}" \
            -X POST \
            "https://${{ secrets.SERVICENOW_INSTANCE }}/api/sn_sc/servicecatalog/items/${{ secrets.SERVICENOW_SYS_ID }}/submit_producer" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{
                  "short_description":"GitHub Actions Connectivity Test",
                  "description":"Incident created from GitHub Actions Ubuntu Runner"
                }')
          CURL_EXIT=$?
          set -e
          
          echo "$RESPONSE"
          
          # Extract HTTP status code
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Curl Exit Code: $CURL_EXIT"
          
          # Exit with failure if curl failed or HTTP status indicates error
          if [ $CURL_EXIT -ne 0 ] || [[ "$HTTP_STATUS" =~ ^[45] ]]; then
            exit 1
          fi
